<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMAYANA: The Retro Epic (2D Rust + WASM)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b090e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            color: #d4af37;
        }
        #game-container {
            width: 1280px;
            height: 720px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 2px rgba(212, 175, 55, 0.6);
            background: #000;
        }
        #glcanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            cursor: crosshair;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #loading {
            position: absolute;
            color: #f7ca45;
            font-size: 20px;
            letter-spacing: 2px;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">⚡ INVOCATING RAMAYANA: THE RETRO EPIC (720p HD)...</div>
        <canvas id="glcanvas" width="1280" height="720" tabindex="1"></canvas>
    </div>
    <script src="mq_js_bundle.js"></script>
    <script>
        load("ramayana_rpg.wasm");
        window.addEventListener("load", () => {
            const el = document.getElementById("loading");
            if (el) {
                setTimeout(() => {
                    el.style.opacity = "0";
                    setTimeout(() => { el.style.display = "none"; }, 500);
                }, 800);
            }
        });
    </script>
</body>
</html>
